<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>ALLAZS Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Стилі -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0f;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 24px;
    }

    .layout {
      max-width: 1200px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: linear-gradient(135deg, #14141b, #111117);
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 6px;
      letter-spacing: 0.07em;
    }

    .value {
      font-size: 24px;
      font-weight: 700;
    }

    .section {
      background: #101018;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 18px;
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
    }

    select {
      background: #181824;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      color: #f5f5f5;
      padding: 6px 10px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
    }

    thead {
      background: #181824;
    }

    tbody tr:nth-child(even) {
      background: rgba(255,255,255,0.02);
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.06);
    }

    .delta {
      font-size: 11px;
      margin-left: 6px;
    }

    .delta.positive {
      color: #4caf50;
    }

    .delta.negative {
      color: #f44336;
    }
  </style>
</head>

<body>
  <div class="layout">
    <h1>ALLAZS Dashboard</h1>
    <div class="subtitle">Панель ефективності менеджерів. Дані з Google Sheets.</div>

    <!-- Картки з метриками -->
    <div class="cards">
      <div class="card">
        <div class="label">Усього літрів (місяць)</div>
        <div class="value" id="total-liters">–</div>
      </div>
      <div class="card">
        <div class="label">Усього угод</div>
        <div class="value" id="total-deals">–</div>
      </div>
      <div class="card">
        <div class="label">Середній літраж на угоду</div>
        <div class="value" id="avg-liters-per-deal">–</div>
      </div>
      <div class="card">
        <div class="label">Кількість менеджерів</div>
        <div class="value" id="manager-count">–</div>
      </div>
    </div>

    <!-- Таблиця менеджерів -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Рейтинг менеджерів</div>
        <select id="sort-select">
          <option value="liters">За літрами</option>
          <option value="deals">За угодами</option>
          <option value="fills">За новими заправками</option>
        </select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Менеджер</th>
            <th>Офіс</th>
            <th>Літри</th>
            <th>Угоди</th>
            <th>Нові заправки</th>
            <th>Перемоги</th>
          </tr>
        </thead>
        <tbody id="manager-table-body"></tbody>
      </table>
    </div>

    <!-- Графік -->
    <div class="section">
      <div class="section-title" style="margin-bottom: 12px;">Літри по менеджерах</div>
      <canvas id="liters-chart" height="120"></canvas>
    </div>
  </div>

  <!-- JS -->
  <script>
    // 👉 Твій endpoint з Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbxG1A27GfDcM79U7QMx7VANay6S6P2PAhie-k4fcoRi4N3_FoUW_cxr5T-IYXwJy3ZN/exec';

    let currentSort = "liters";
    let litersChartInstance = null;
    let MANAGERS_DATA = [];

    function formatNumber(num) {
      return num.toLocaleString("uk-UA");
    }

    function calcMetrics(data) {
      const totalLiters = data.reduce((sum, m) => sum + (m.liters || 0), 0);
      const totalDeals = data.reduce((sum, m) => sum + (m.deals || 0), 0);
      const avgLitersPerDeal = totalDeals > 0 ? totalLiters / totalDeals : 0;
      const managerCount = data.length;
      return { totalLiters, totalDeals, avgLitersPerDeal, managerCount };
    }

    function renderTopCards(data) {
      const { totalLiters, totalDeals, avgLitersPerDeal, managerCount } =
        calcMetrics(data);

      document.getElementById("total-liters").textContent =
        formatNumber(totalLiters) + " л";

      document.getElementById("total-deals").textContent =
        formatNumber(totalDeals);

      document.getElementById("avg-liters-per-deal").textContent =
        avgLitersPerDeal.toFixed(0) + " л";

      document.getElementById("manager-count").textContent = managerCount;
    }

    function getSortedData(data, sortKey) {
      const arr = [...data];
      if (sortKey === "liters") {
        arr.sort((a, b) => (b.liters || 0) - (a.liters || 0));
      } else if (sortKey === "deals") {
        arr.sort((a, b) => (b.deals || 0) - (a.deals || 0));
      } else if (sortKey === "fills") {
        arr.sort((a, b) => (b.newFills || 0) - (a.newFills || 0));
      }
      return arr;
    }

    function formatDelta(pct) {
      if (pct === null || isNaN(pct)) return "";
      const sign = pct > 0 ? "+" : "";
      const cls = pct > 0 ? "delta positive" : "delta negative";
      return `<span class="${cls}">${sign}${pct.toFixed(1)}%</span>`;
    }

    function renderTable(data) {
      const tbody = document.getElementById("manager-table-body");
      tbody.innerHTML = "";

      data.forEach((m) => {
        const dealsCell = `
          ${formatNumber(m.deals || 0)}
          ${formatDelta(m.dealsChangePct)}
        `;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.name || ''}</td>
          <td>${m.office || ''}</td>
          <td>${formatNumber(m.liters || 0)} л</td>
          <td>${dealsCell}</td>
          <td>${formatNumber(m.newFills || 0)}</td>
          <td>${formatNumber(m.wins || 0)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderChart(data) {
      const ctx = document.getElementById("liters-chart").getContext("2d");
      const labels = data.map((m) => m.name);
      const liters = data.map((m) => m.liters || 0);

      if (litersChartInstance) {
        litersChartInstance.destroy();
      }

      litersChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels,
          datasets: [
            {
              label: "Літри (за місяць)",
              data: liters
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: { color: "#f5f5f5" }
            }
          },
          scales: {
            x: {
              ticks: { color: "#f5f5f5" },
              grid: { display: false }
            },
            y: {
              ticks: { color: "#f5f5f5" },
              grid: { color: "rgba(255,255,255,0.1)" }
            }
          }
        }
      });
    }

    function renderAll() {
      const sorted = getSortedData(MANAGERS_DATA, currentSort);
      renderTopCards(sorted);
      renderTable(sorted);
      renderChart(sorted);
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        MANAGERS_DATA = data;
        renderAll();
      } catch (err) {
        console.error("Помилка завантаження даних з API:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const sortSelect = document.getElementById("sort-select");
      sortSelect.addEventListener("change", (e) => {
        currentSort = e.target.value;
        renderAll();
      });

      loadData();
    });
  </script>
</body>
</html>
