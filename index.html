<script>
  // 🔑 ВСТАВ НОВИЙ URL ВЕБ-ДОДАТКА APP SCRIPT
  var API_URL = 'https://script.google.com/macros/s/AKfycbzGFLQHObPRHPaglIBqlW6_AhPXSz3TQWyhMPwitFyOlQw3xjCFYMOoaDbIQa0u-315/exec';

  var currentSort = 'liters';
  var currentMonth = 'Листопад';
  var MANAGERS_DATA = [];

  function safeNumber(x) {
    var n = Number(x);
    return isNaN(n) ? 0 : n;
  }

  function formatNumber(num) {
    return safeNumber(num).toLocaleString('uk-UA');
  }

  function diffPct(current, prev) {
    current = safeNumber(current);
    prev = safeNumber(prev);
    if (!prev) return null;
    return ((current - prev) / prev) * 100;
  }

  // ===== Агрегати для карток =====
  function calcTotals(data) {
    var totalLiters = 0, totalLitersPrev = 0;
    var totalDeals  = 0, totalDealsPrev  = 0;
    var totalFills  = 0, totalFillsPrev  = 0;

    for (var i = 0; i < data.length; i++) {
      var m = data[i];
      totalLiters     += safeNumber(m.liters);
      totalLitersPrev += safeNumber(m.litersPrev);
      totalDeals      += safeNumber(m.deals);
      totalDealsPrev  += safeNumber(m.dealsPrev);
      totalFills      += safeNumber(m.fills);
      totalFillsPrev  += safeNumber(m.fillsPrev);
    }

    return {
      totalLiters: totalLiters,
      totalLitersPrev: totalLitersPrev,
      totalDeals: totalDeals,
      totalDealsPrev: totalDealsPrev,
      totalFills: totalFills,
      totalFillsPrev: totalFillsPrev,
      managerCount: data.length
    };
  }

  function renderCardDelta(elementId, pct) {
    var el = document.getElementById(elementId);
    if (!el) return;
    if (pct === null || pct === undefined || isNaN(pct)) {
      el.textContent = '';
      el.className = 'card-delta';
      return;
    }
    var sign = pct > 0 ? '+' : '';
    el.textContent = sign + pct.toFixed(1) + '%';
    el.className = 'card-delta ' + (pct > 0 ? 'positive' : 'negative');
  }

  function renderTopCards(data) {
    var t = calcTotals(data);

    document.getElementById('total-liters').textContent =
      formatNumber(t.totalLiters) + ' л';
    document.getElementById('total-deals').textContent =
      formatNumber(t.totalDeals);
    document.getElementById('total-fills').textContent =
      formatNumber(t.totalFills);
    document.getElementById('manager-count').textContent = t.managerCount;

    renderCardDelta(
      'total-liters-delta',
      diffPct(t.totalLiters, t.totalLitersPrev)
    );
    renderCardDelta(
      'total-deals-delta',
      diffPct(t.totalDeals, t.totalDealsPrev)
    );
    renderCardDelta(
      'total-fills-delta',
      diffPct(t.totalFills, t.totalFillsPrev)
    );
  }

  // ===== Сортування та таблиця =====
  function getSortedData(data, sortKey) {
    var arr = data.slice();
    arr.sort(function(a, b) {
      if (sortKey === 'liters') {
        return safeNumber(b.liters) - safeNumber(a.liters);
      } else if (sortKey === 'deals') {
        return safeNumber(b.deals) - safeNumber(a.deals);
      } else if (sortKey === 'fills') {
        return safeNumber(b.fills) - safeNumber(a.fills);
      }
      return 0;
    });
    return arr;
  }

  function formatDeltaCell(current, prev) {
    var pct = diffPct(current, prev);
    if (pct === null) return '';
    var sign = pct > 0 ? '+' : '';
    var cls = pct > 0 ? 'delta positive' : 'delta negative';
    return '<span class="' + cls + '">' + sign + pct.toFixed(1) + '%</span>';
  }

  function openManagerWindow(manager) {
    if (!manager || !manager.name) return;
    var url = 'manager.html?name=' +
      encodeURIComponent(manager.name) +
      '&month=' + encodeURIComponent(currentMonth);
    window.open(url, '_blank');
  }

  function attachRowCabinetHandler(tr, managerObj) {
    tr.addEventListener('click', function() {
      openManagerWindow(managerObj);
    });
  }

  function renderTable(data) {
    var tbody = document.getElementById('manager-table-body');
    tbody.innerHTML = '';

    for (var i = 0; i < data.length; i++) {
      var m = data[i];

      var litersCell =
        formatNumber(m.liters) + ' л ' + formatDeltaCell(m.liters, m.litersPrev);
      var dealsCell =
        formatNumber(m.deals) + ' ' + formatDeltaCell(m.deals, m.dealsPrev);
      var fillsCell =
        formatNumber(m.fills) + ' ' + formatDeltaCell(m.fills, m.fillsPrev);
      var winsCell =
        formatNumber(m.wins) + ' ' + formatDeltaCell(m.wins, m.winsPrev);

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + (m.name || '') + '</td>' +
        '<td>' + (m.office || '') + '</td>' +
        '<td>' + litersCell + '</td>' +
        '<td>' + dealsCell + '</td>' +
        '<td>' + fillsCell + '</td>' +
        '<td>' + winsCell + '</td>';
      attachRowCabinetHandler(tr, m);
      tbody.appendChild(tr);
    }
  }

  // ===== Лідерборд =====
  function computeLeaderboard(data) {
    if (!data || !data.length) return [];

    var maxLiters = 0, maxDeals = 0, maxFills = 0, maxWins = 0;
    for (var i = 0; i < data.length; i++) {
      maxLiters = Math.max(maxLiters, safeNumber(data[i].liters));
      maxDeals  = Math.max(maxDeals,  safeNumber(data[i].deals));
      maxFills  = Math.max(maxFills,  safeNumber(data[i].fills));
      maxWins   = Math.max(maxWins,   safeNumber(data[i].wins));
    }

    var wLiters = 4, wDeals = 3, wFills = 2, wWins = 1;
    var arr = [];

    for (var j = 0; j < data.length; j++) {
      var m = data[j];
      var litersNorm = maxLiters ? safeNumber(m.liters) / maxLiters : 0;
      var dealsNorm  = maxDeals  ? safeNumber(m.deals)  / maxDeals  : 0;
      var fillsNorm  = maxFills  ? safeNumber(m.fills)  / maxFills  : 0;
      var winsNorm   = maxWins   ? safeNumber(m.wins)   / maxWins   : 0;

      var score = litersNorm * wLiters +
                  dealsNorm  * wDeals  +
                  fillsNorm  * wFills  +
                  winsNorm   * wWins;

      var copy = {};
      for (var key in m) copy[key] = m[key];
      copy.score = score;
      arr.push(copy);
    }

    arr.sort(function(a, b) { return b.score - a.score; });
    return arr;
  }

  function renderLeaderboard(data) {
    var tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = '';

    var ranked = computeLeaderboard(data);
    for (var i = 0; i < ranked.length; i++) {
      var m = ranked[i];
      var place = i + 1;
      var medal = '';
      if (i === 0) medal = '🥇';
      else if (i === 1) medal = '🥈';
      else if (i === 2) medal = '🥉';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="medal-cell">' +
          '<span class="rank-badge">' + place + '</span> ' + medal +
        '</td>' +
        '<td>' + (m.name || '') + '</td>' +
        '<td>' + (m.office || '') + '</td>' +
        '<td>' + formatNumber(m.liters) + ' л</td>' +
        '<td>' + formatNumber(m.deals) + '</td>' +
        '<td>' + formatNumber(m.fills) + '</td>' +
        '<td>' + formatNumber(m.wins) + '</td>' +
        '<td class="leader-score">' + Math.round(m.score * 100) + '</td>';
      attachRowCabinetHandler(tr, m);
      tbody.appendChild(tr);
    }
  }

  function renderAll() {
    var sorted = getSortedData(MANAGERS_DATA, currentSort);
    renderTopCards(sorted);
    renderTable(sorted);
    renderLeaderboard(MANAGERS_DATA);
  }

  function loadData(month) {
    currentMonth = month;
    var errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';
    errorBox.textContent = '';

    var url = API_URL + '?month=' + encodeURIComponent(month);

    fetch(url)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data || !Array.isArray(data.managers)) {
          throw new Error('Некоректна відповідь API');
        }
        MANAGERS_DATA = data.managers || [];
        renderAll();
      })
      .catch(function(err) {
        console.error('Помилка завантаження з API:', err);
        errorBox.textContent =
          'Помилка завантаження даних з API. Перевір Apps Script або доступ до таблиці.';
        errorBox.style.display = 'block';
        MANAGERS_DATA = [];
        renderAll();
      });
  }

  document.addEventListener('DOMContentLoaded', function() {
    var sortSelect = document.getElementById('sort-select');
    sortSelect.addEventListener('change', function(e) {
      currentSort = e.target.value;
      renderAll();
    });

    var monthSelect = document.getElementById('month-select');
    monthSelect.value = currentMonth;
    monthSelect.addEventListener('change', function(e) {
      loadData(e.target.value);
    });

    loadData(currentMonth);
  });
</script>
