<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>ALLAZS Dashboard</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 32px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #020617; /* як у кабінеті */
    color: #e5e7eb;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px;
    color: #f9fafb;
  }

  .subtitle {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  .layout {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* верхня панель */
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }

  .month-select-wrapper {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    font-size: 13px;
    color: #9ca3af;
  }

  select {
    background: #020617;
    color: #e5e7eb;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.5);
    padding: 6px 12px;
    font-size: 13px;
    outline: none;
  }

  select:focus {
    border-color: #60a5fa;
  }

  /* картки зверху – в стилі кабінету */

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: radial-gradient(circle at top left, #111827, #020617);
    border-radius: 18px;
    padding: 18px 20px;
    box-shadow: 0 22px 45px rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.12);
  }

  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9ca3af;
    margin-bottom: 8px;
  }

  .value {
    font-size: 26px;
    font-weight: 600;
    color: #f9fafb;
  }

  .card-delta {
    font-size: 13px;
    margin-top: 4px;
  }

  .card-delta.positive { color: #4ade80; }
  .card-delta.negative { color: #f97373; }

  /* секції-«контейнери» як у кабінеті */

  .section {
    background: radial-gradient(circle at top left, #0b1220, #020617);
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, 0.12);
    padding: 18px 20px;
    margin-bottom: 24px;
    box-shadow: 0 22px 45px rgba(15, 23, 42, 0.8);
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    color: #f9fafb;
  }

  /* таблиці */

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead {
    background: rgba(15, 23, 42, 0.96);
  }

  th, td {
    padding: 9px 12px;
    text-align: left;
  }

  th {
    font-weight: 500;
    color: #9ca3af;
    border-bottom: 1px solid rgba(55, 65, 81, 0.9);
  }

  tbody tr:nth-child(odd) {
    background: rgba(15, 23, 42, 0.85);
  }

  tbody tr:nth-child(even) {
    background: rgba(15, 23, 42, 0.6);
  }

  tbody tr:hover {
    background: rgba(37, 99, 235, 0.25);
    cursor: pointer;
  }

  .delta {
    font-size: 11px;
    margin-left: 6px;
  }

  .delta.positive { color: #4ade80; }
  .delta.negative { color: #f97373; }

  /* лідерборд */

  .medal-cell {
    width: 70px;
  }

  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 24px;
    border-radius: 999px;
    font-size: 12px;
    background: rgba(15, 23, 42, 0.9);
    color: #e5e7eb;
    margin-right: 6px;
  }

  .leader-score {
    text-align: right;
    font-weight: 600;
    font-size: 14px;
    color: #e5e7eb;
  }

  /* повідомлення про помилки */

  .error-message {
    color: #fca5a5;
    font-size: 13px;
    margin-top: 4px;
  }

  /* адаптив */

  @media (max-width: 768px) {
    body {
      padding: 20px 12px;
    }

    .top-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .month-select-wrapper {
      align-items: flex-start;
    }
  }
</style>

</head>

<body>
  <div class="layout">
    <div class="top-row">
      <div>
        <h1>ALLAZS Dashboard</h1>
        <div class="subtitle">Панель ефективності менеджерів. Дані з Google Sheets.</div>
        <div id="error-box" class="error-message" style="display:none;"></div>
      </div>
      <div class="month-select-wrapper">
        <div class="month-label">Місяць</div>
        <select id="month-select">
          <option value="Листопад">Листопад</option>
          <option value="Жовтень">Жовтень</option>
        </select>
      </div>
    </div>

    <!-- Картки -->
    <div class="cards">
      <div class="card">
        <div class="label">Всього літрів (місяць)</div>
        <div class="value" id="total-liters">–</div>
        <div class="card-delta" id="total-liters-delta"></div>
      </div>
      <div class="card">
        <div class="label">Всього угод</div>
        <div class="value" id="total-deals">–</div>
        <div class="card-delta" id="total-deals-delta"></div>
      </div>
      <div class="card">
        <div class="label">Всього нових заправок</div>
        <div class="value" id="total-fills">–</div>
        <div class="card-delta" id="total-fills-delta"></div>
      </div>
      <div class="card">
        <div class="label">Кількість менеджерів</div>
        <div class="value" id="manager-count">–</div>
      </div>
    </div>

    <!-- Результати -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Результати</div>
        <select id="sort-select">
          <option value="liters">За літрами</option>
          <option value="deals">За угодами</option>
          <option value="fills">За новими заправками</option>
        </select>
      </div>
      <table>
        <thead>
        <tr>
          <th>Менеджер</th>
          <th>Офіс</th>
          <th>Літри</th>
          <th>Угоди</th>
          <th>Нові заправки</th>
          <th>Перемоги</th>
        </tr>
        </thead>
        <tbody id="manager-table-body"></tbody>
      </table>
    </div>

    <!-- Лідерборд -->
    <div class="section">
      <div class="section-title" style="margin-bottom: 12px;">Лідерборд</div>
      <table>
        <thead>
        <tr>
          <th class="medal-cell">Місце</th>
          <th>Менеджер</th>
          <th>Офіс</th>
          <th>Літри</th>
          <th>Угоди</th>
          <th>Нові заправки</th>
          <th>Перемоги</th>
          <th>Бали</th>
        </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 🔑 ВСТАВ СЮДИ СВІЙ URL З APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbzlH1R7dypCXxL72bIserJiVi9sdn6L1FN0JVDtAGSxxTNWdTgXS6Rz66wx4WkuDa-2/exec';

    let currentSort = 'liters';
    let currentMonth = 'Листопад';
    let MANAGERS_DATA = [];

    function safeNumber(x) {
      const n = Number(x);
      return isNaN(n) ? 0 : n;
    }

    function formatNumber(num) {
      return safeNumber(num).toLocaleString('uk-UA');
    }

    function cardAggregateChange(current, prev) {
      if (!prev || prev <= 0) return null;
      return ((current - prev) / prev) * 100;
    }

    function renderCardDelta(elementId, pct) {
      const el = document.getElementById(elementId);
      if (!el) return;
      if (pct === null || pct === undefined || isNaN(pct)) {
        el.textContent = '';
        el.className = 'card-delta';
        return;
      }
      const sign = pct > 0 ? '+' : '';
      el.textContent = sign + pct.toFixed(1) + '%';
      el.className = 'card-delta ' + (pct > 0 ? 'positive' : 'negative');
    }

    function calcTotals(data) {
      let totalLiters = 0, totalLitersPrev = 0;
      let totalDeals  = 0, totalDealsPrev  = 0;
      let totalFills  = 0, totalFillsPrev  = 0;

      data.forEach(m => {
        const curL = safeNumber(m.liters);
        const curD = safeNumber(m.deals);
        const curF = safeNumber(m.newFills);

        totalLiters += curL;
        totalDeals  += curD;
        totalFills  += curF;

        // попередні значення з % (які порахував Apps Script)
        if (m.litersChangePct != null) {
          const prevL = curL / (1 + m.litersChangePct / 100);
          totalLitersPrev += prevL;
        }
        if (m.dealsChangePct != null) {
          const prevD = curD / (1 + m.dealsChangePct / 100);
          totalDealsPrev += prevD;
        }
        if (m.newFillsChangePct != null) {
          const prevF = curF / (1 + m.newFillsChangePct / 100);
          totalFillsPrev += prevF;
        }
      });

      return {
        totalLiters,
        totalLitersPrev,
        totalDeals,
        totalDealsPrev,
        totalFills,
        totalFillsPrev,
        managerCount: data.length
      };
    }

    function getSortedData(data, sortKey) {
      const arr = data.slice();
      arr.sort((a, b) => {
        if (sortKey === 'liters') {
          return safeNumber(b.liters) - safeNumber(a.liters);
        } else if (sortKey === 'deals') {
          return safeNumber(b.deals) - safeNumber(a.deals);
        } else if (sortKey === 'fills') {
          return safeNumber(b.newFills) - safeNumber(a.newFills);
        }
        return 0;
      });
      return arr;
    }

    function formatDelta(pct) {
      if (pct === null || pct === undefined || isNaN(pct)) return '';
      const sign = pct > 0 ? '+' : '';
      const cls = pct > 0 ? 'delta positive' : 'delta negative';
      return '<span class="' + cls + '">' + sign + pct.toFixed(1) + '%</span>';
    }

    function openManagerWindow(manager) {
      if (!manager || !manager.name) return;
      const url =
        'manager.html?name=' +
        encodeURIComponent(manager.name) +
        '&month=' +
        encodeURIComponent(currentMonth);
      window.open(url, '_blank');
    }

    function attachRowCabinetHandler(tr, managerObj) {
      tr.addEventListener('click', function () {
        openManagerWindow(managerObj);
      });
    }

    function renderTopCards(data) {
      const t = calcTotals(data);
      document.getElementById('total-liters').textContent =
        formatNumber(t.totalLiters) + ' л';
      document.getElementById('total-deals').textContent =
        formatNumber(t.totalDeals);
      document.getElementById('total-fills').textContent =
        formatNumber(t.totalFills);
      document.getElementById('manager-count').textContent = t.managerCount;

      renderCardDelta(
        'total-liters-delta',
        cardAggregateChange(t.totalLiters, t.totalLitersPrev)
      );
      renderCardDelta(
        'total-deals-delta',
        cardAggregateChange(t.totalDeals, t.totalDealsPrev)
      );
      renderCardDelta(
        'total-fills-delta',
        cardAggregateChange(t.totalFills, t.totalFillsPrev)
      );
    }

    function renderTable(data) {
      const tbody = document.getElementById('manager-table-body');
      tbody.innerHTML = '';

      data.forEach(m => {
        const litersCell =
          formatNumber(m.liters) + ' л ' + formatDelta(m.litersChangePct);
        const dealsCell =
          formatNumber(m.deals) + ' ' + formatDelta(m.dealsChangePct);
        const fillsCell =
          formatNumber(m.newFills) + ' ' + formatDelta(m.newFillsChangePct);
        const winsCell =
          formatNumber(m.wins) + ' ' + formatDelta(m.winsChangePct);

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (m.name || '') + '</td>' +
          '<td>' + (m.office || '') + '</td>' +
          '<td>' + litersCell + '</td>' +
          '<td>' + dealsCell + '</td>' +
          '<td>' + fillsCell + '</td>' +
          '<td>' + winsCell + '</td>';
        attachRowCabinetHandler(tr, m);
        tbody.appendChild(tr);
      });
    }

    // ----- лідерборд -----
    function computeLeaderboard(data) {
      if (!data || !data.length) return [];

      let maxLiters = 0, maxDeals = 0, maxFills = 0, maxWins = 0;
      data.forEach(m => {
        maxLiters = Math.max(maxLiters, safeNumber(m.liters));
        maxDeals  = Math.max(maxDeals,  safeNumber(m.deals));
        maxFills  = Math.max(maxFills,  safeNumber(m.newFills));
        maxWins   = Math.max(maxWins,   safeNumber(m.wins));
      });

      const wLiters = 4, wDeals = 3, wFills = 2, wWins = 1;

      return data.map(m => {
        const litersNorm = maxLiters ? safeNumber(m.liters) / maxLiters : 0;
        const dealsNorm  = maxDeals  ? safeNumber(m.deals)  / maxDeals  : 0;
        const fillsNorm  = maxFills  ? safeNumber(m.newFills) / maxFills : 0;
        const winsNorm   = maxWins   ? safeNumber(m.wins)   / maxWins   : 0;

        const score = litersNorm * wLiters +
                      dealsNorm  * wDeals  +
                      fillsNorm  * wFills  +
                      winsNorm   * wWins;

        return { ...m, score };
      }).sort((a, b) => b.score - a.score);
    }

    function renderLeaderboard(data) {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      const ranked = computeLeaderboard(data);

      ranked.forEach((m, i) => {
        const place = i + 1;
        let medal = '';
        if (i === 0) medal = '🥇';
        else if (i === 1) medal = '🥈';
        else if (i === 2) medal = '🥉';

        const tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="medal-cell">' +
          '<span class="rank-badge">' + place + '</span> ' + medal +
          '</td>' +
          '<td>' + (m.name || '') + '</td>' +
          '<td>' + (m.office || '') + '</td>' +
          '<td>' + formatNumber(m.liters) + ' л</td>' +
          '<td>' + formatNumber(m.deals) + '</td>' +
          '<td>' + formatNumber(m.newFills) + '</td>' +
          '<td>' + formatNumber(m.wins) + '</td>' +
          '<td class="leader-score">' + Math.round(m.score * 100) + '</td>';
        attachRowCabinetHandler(tr, m);
        tbody.appendChild(tr);
      });
    }

    function renderAll() {
      const sorted = getSortedData(MANAGERS_DATA, currentSort);
      renderTopCards(sorted);
      renderTable(sorted);
      renderLeaderboard(sorted);
    }

    function loadData(month) {
      currentMonth = month;
      const errorBox = document.getElementById('error-box');
      errorBox.style.display = 'none';
      errorBox.textContent = '';

      const url = API_URL + '?month=' + encodeURIComponent(month);

      fetch(url)
        .then(res => res.text())
        .then(text => {
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            console.error('JSON parse error:', text);
            throw new Error('Невірний формат відповіді API');
          }

          if (!Array.isArray(data)) {
            console.error('API повернув не масив:', data);
            throw new Error('API повернув помилку або неочікувані дані');
          }

          MANAGERS_DATA = data;
          renderAll();
        })
        .catch(err => {
          console.error('Помилка завантаження з API:', err);
          errorBox.textContent =
            'Помилка завантаження даних з API. Перевір Apps Script або доступ до таблиці.';
          errorBox.style.display = 'block';
          MANAGERS_DATA = [];
          renderAll();
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
      const sortSelect = document.getElementById('sort-select');
      sortSelect.addEventListener('change', function (e) {
        currentSort = e.target.value;
        renderAll();
      });

      const monthSelect = document.getElementById('month-select');
      monthSelect.value = currentMonth;
      monthSelect.addEventListener('change', function (e) {
        loadData(e.target.value);
      });

      loadData(currentMonth);
    });
  </script>
</body>
</html>
