<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxWPOVlfsunh3dfFBIf9yVTggKud_gSpBMDArDtSjd98VguLgb1QY0EdS-kwWXyJk2O/exec';

  const params = new URLSearchParams(window.location.search);
  const managerName = params.get('manager');
  const month = params.get('month') || 'Листопад';

  const titleEl = document.querySelector('.manager-name');      // заголовок з імʼям
  const officeEl = document.querySelector('.manager-office');   // офіс
  const monthEl  = document.querySelector('.manager-month');    // місяць
  const errorEl  = document.querySelector('.manager-error');    // червона помилка

  // План / факт
  const planLitersEl   = document.querySelector('.plan-liters');
  const factLitersEl   = document.querySelector('.fact-liters');
  const planDealsEl    = document.querySelector('.plan-deals');
  const factDealsEl    = document.querySelector('.fact-deals');
  const planFillsEl    = document.querySelector('.plan-fills');
  const factFillsEl    = document.querySelector('.fact-fills');
  const planWinsEl     = document.querySelector('.plan-wins');
  const factWinsEl     = document.querySelector('.fact-wins');

  // Карточки зверху
  const totalScoreEl   = document.querySelector('.total-score');
  const litersDealsEl  = document.querySelector('.liters-deals');

  titleEl.textContent = managerName || 'Менеджер';
  officeEl.textContent = 'Офіс: —';
  monthEl.textContent  = 'Місяць: ' + month;

  fetch(`${API_URL}?month=${encodeURIComponent(month)}`)
    .then(r => r.json())
    .then(data => {
      if (!Array.isArray(data)) {
        errorEl.textContent = 'Помилка завантаження даних.';
        return;
      }

      const manager = data.find(m => m.name === managerName);

      if (!manager) {
        errorEl.textContent = `Менеджера "${managerName}" не знайдено у даних за цей місяць.`;
        return;
      }

      // Прибираємо помилку, бо все ОК
      errorEl.textContent = '';

      titleEl.textContent = manager.name;
      officeEl.textContent = 'Офіс: ' + (manager.office || '—');
      monthEl.textContent  = 'Місяць: ' + month;

      totalScoreEl.textContent  = manager.score ?? '—';
      litersDealsEl.textContent = `${manager.liters || 0} л / ${manager.deals || 0} угод`;

      // Плани / факт
      planLitersEl.textContent = manager.planLiters || '—';
      factLitersEl.textContent = manager.liters || '—';

      planDealsEl.textContent  = manager.planDeals || '—';
      factDealsEl.textContent  = manager.deals || '—';

      planFillsEl.textContent  = manager.planFills || '—';
      factFillsEl.textContent  = manager.newFills || '—';

      planWinsEl.textContent   = manager.planWins || '—';
      factWinsEl.textContent   = manager.wins || '—';

      // Тут же можна буде докрутити статистику дзвінків, коли підʼєднаємо телефонію
    })
    .catch(err => {
      console.error(err);
      errorEl.textContent = 'Помилка запиту до API.';
    });
</script>
