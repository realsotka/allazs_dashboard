<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Кабінет менеджера — ALLAZS Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050713;
      color: #f9fafb;
    }
    .page {
      max-width: 1100px;
      margin: 24px auto 48px;
      padding: 0 16px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
    }
    .top-bar h1 {
      font-size: 28px;
      margin: 0 0 4px;
    }
    .top-bar-sub {
      font-size: 14px;
      color: #9ca3af;
    }
    a.back-link {
      font-size: 14px;
      color: #93c5fd;
      text-decoration: none;
    }
    a.back-link:hover { text-decoration: underline; }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: radial-gradient(circle at top left, #111827, #020617);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.08);
    }
    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 12px;
    }
    .card-value {
      font-size: 24px;
      font-weight: 600;
    }
    .card-sub {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 6px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin: 28px 0 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    thead {
      background: rgba(15, 23, 42, 0.9);
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
    }
    th {
      font-weight: 500;
      color: #9ca3af;
      border-bottom: 1px solid rgba(55, 65, 81, 0.9);
    }
    tbody tr:nth-child(odd) {
      background: rgba(15, 23, 42, 0.7);
    }
    tbody tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.4);
    }
    .muted {
      color: #9ca3af;
      font-size: 13px;
    }
    .error {
      margin-top: 18px;
      font-size: 14px;
      color: #fca5a5;
    }

    /* 🔥 Блок телефонії */
    .phone-stats {
      margin-top: 8px;
    }
    .phone-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 4px;
    }
    .phone-card {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .phone-period {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e5e7eb;
    }
    .phone-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
      color: #9ca3af;
    }
    .phone-row span {
      opacity: 0.9;
    }
    .phone-row b {
      color: #f9fafb;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div>
        <h1 id="manager-name">Менеджер</h1>
        <div class="top-bar-sub">
          <span id="manager-office">Офіс</span> ·
          <span id="manager-month">Місяць</span>
        </div>
      </div>
      <div>
        <a href="index.html" class="back-link">← Повернутися до дашборду</a>
      </div>
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-title">СУМАРНІ БАЛИ</div>
        <div class="card-value" id="score">—</div>
        <div class="card-sub">
          Розраховано за літрами, угодами, новими заправками та перемогами.
        </div>
      </div>

      <div class="card">
        <div class="card-title">ЛІТРИ / УГОДИ</div>
        <div class="card-value" id="liters-deals">—</div>
        <div class="card-sub" id="fills-wins-sub">Нові заправки: —, перемоги: —</div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">План / факт за місяць</div>
      <table>
        <thead>
        <tr>
          <th>Метріка</th>
          <th>План</th>
          <th>Факт</th>
          <th>%</th>
        </tr>
        </thead>
        <tbody id="plan-table-body"></tbody>
      </table>
    </div>

    <!-- 🔥 НОВИЙ ЖИВИЙ БЛОК ТЕЛЕФОНІЇ -->
    <div class="card" style="margin-top: 24px;">
      <div class="section-title">Статистика дзвінків</div>
      <div id="phone-stats" class="phone-stats muted">
        Завантаження статистики телефонії...
      </div>
    </div>

    <div id="error-box" class="error" style="display:none;"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzlH1R7dypCXxL72bIserJiVi9sdn6L1FN0JVDtAGSxxTNWdTgXS6Rz66wx4WkuDa-2/exec'; // той самий що в index.html

    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        name: params.get('name') || '',
        month: params.get('month') || 'Листопад',
      };
    }

    function safeNumber(x) {
      const n = Number(x);
      return isNaN(n) ? 0 : n;
    }

    function formatNumber(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return Number(n).toLocaleString('uk-UA');
    }

    function formatPercent(v) {
      if (v === null || v === undefined || isNaN(v)) return '—';
      return v.toFixed(1).replace('.', ',') + ' %';
    }

    function calcPlanPercent(plan, fact) {
      const p = Number(plan) || 0;
      const f = Number(fact) || 0;
      if (!p) return '—';
      return formatPercent((f / p) * 100);
    }

    // 🔥 Форматування тривалості дзвінків
    function formatCallTime(sec) {
      sec = Number(sec) || 0;
      const minutes = Math.floor(sec / 60);
      const seconds = Math.floor(sec % 60);
      if (!minutes && !seconds) return '0 с';
      if (!minutes) return `${seconds} с`;
      if (!seconds) return `${minutes} хв`;
      return `${minutes} хв ${seconds} с`;
    }

    function computeLeaderboardScores(data) {
      if (!data || !data.length) return [];

      let maxLiters = 0, maxDeals = 0, maxFills = 0, maxWins = 0;
      data.forEach(m => {
        maxLiters = Math.max(maxLiters, safeNumber(m.liters));
        maxDeals  = Math.max(maxDeals,  safeNumber(m.deals));
        maxFills  = Math.max(maxFills,  safeNumber(m.newFills));
        maxWins   = Math.max(maxWins,   safeNumber(m.wins));
      });

      const wLiters = 4, wDeals = 3, wFills = 2, wWins = 1;

      return data.map(m => {
        const litersNorm = maxLiters ? safeNumber(m.liters) / maxLiters : 0;
        const dealsNorm  = maxDeals  ? safeNumber(m.deals)  / maxDeals  : 0;
        const fillsNorm  = maxFills  ? safeNumber(m.newFills) / maxFills : 0;
        const winsNorm   = maxWins   ? safeNumber(m.wins)   / maxWins   : 0;

        const score = litersNorm * wLiters +
                      dealsNorm  * wDeals  +
                      fillsNorm  * wFills  +
                      winsNorm   * wWins;

        return { ...m, score };
      }).sort((a, b) => b.score - a.score);
    }

    async function loadManagerPage() {
      const { name, month } = getQueryParams();
      const errorBox = document.getElementById('error-box');

      if (!name) {
        errorBox.style.display = 'block';
        errorBox.textContent = 'Не передано параметр name у URL.';
        return;
      }

      try {
        const resp = await fetch(`${API_URL}?month=${encodeURIComponent(month)}`);
        if (!resp.ok) {
          throw new Error('Помилка запиту: ' + resp.status);
        }

        const text = await resp.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          console.error('JSON parse error:', text);
          throw new Error('Некоректна відповідь API.');
        }

        if (!Array.isArray(data)) {
          throw new Error('Некоректна відповідь API.');
        }

        const mgr = data.find(m => m.name === name);

        document.getElementById('manager-name').textContent = name;
        document.getElementById('manager-office').textContent = mgr ? (mgr.office || '—') : '—';
        document.getElementById('manager-month').textContent = month;

        if (!mgr) {
          errorBox.style.display = 'block';
          errorBox.textContent = `Менеджера "${name}" не знайдено у даних за цей місяць.`;
          return;
        }

        // бал
        const scored = computeLeaderboardScores(data);
        const scoredMgr = scored.find(m => m.name === name);
        const scoreValue = scoredMgr ? Math.round(scoredMgr.score * 100) : null;
        document.getElementById('score').textContent =
          scoreValue !== null ? formatNumber(scoreValue) : '—';

        // верхня картка
        document.getElementById('liters-deals').textContent =
          `${formatNumber(mgr.liters)} л / ${formatNumber(mgr.deals)} угод`;
        document.getElementById('fills-wins-sub').textContent =
          `Нові заправки: ${formatNumber(mgr.newFills)}, перемоги: ${formatNumber(mgr.wins)}`;

        // таблиця план / факт
        const rows = [
          { label: 'Літри',        plan: mgr.planLiters, fact: mgr.liters },
          { label: 'Угоди',        plan: mgr.planDeals,  fact: mgr.deals },
          { label: 'Нові заправки',plan: mgr.planFills,  fact: mgr.newFills },
          { label: 'Перемоги',     plan: mgr.planWins,   fact: mgr.wins },
        ];

        const tbody = document.getElementById('plan-table-body');
        tbody.innerHTML = '';

        rows.forEach(row => {
          const tr = document.createElement('tr');

          const tdMetric = document.createElement('td');
          tdMetric.textContent = row.label;

          const tdPlan = document.createElement('td');
          tdPlan.textContent = row.plan != null ? formatNumber(row.plan) : '—';

          const tdFact = document.createElement('td');
          tdFact.textContent = formatNumber(row.fact);

          const tdPercent = document.createElement('td');
          tdPercent.textContent = calcPlanPercent(row.plan, row.fact);

          tr.appendChild(tdMetric);
          tr.appendChild(tdPlan);
          tr.appendChild(tdFact);
          tr.appendChild(tdPercent);
          tbody.appendChild(tr);
        });

        // 🔥 Рендер телефонії
        const phoneStatsEl = document.getElementById('phone-stats');

        const callsToday      = safeNumber(mgr.callsToday);
        const totalTodaySec   = safeNumber(mgr.totalTodaySec);
        const avgTodaySec     = safeNumber(mgr.avgTodaySec);

        const callsWeek       = safeNumber(mgr.callsWeek);
        const totalWeekSec    = safeNumber(mgr.totalWeekSec);
        const avgWeekSec      = safeNumber(mgr.avgWeekSec);

        const callsMonth      = safeNumber(mgr.callsMonth);
        const totalMonthSec   = safeNumber(mgr.totalMonthSec);
        const avgMonthSec     = safeNumber(mgr.avgMonthSec);

        phoneStatsEl.classList.remove('muted');
        phoneStatsEl.innerHTML = `
          <div class="phone-grid">
            <div class="phone-card">
              <div class="phone-period">Сьогодні</div>
              <div class="phone-row">
                <span>Дзвінків</span>
                <b>${callsToday}</b>
              </div>
              <div class="phone-row">
                <span>Час розмов</span>
                <b>${formatCallTime(totalTodaySec)}</b>
              </div>
              <div class="phone-row">
                <span>Середня тривалість</span>
                <b>${formatCallTime(avgTodaySec)}</b>
              </div>
            </div>

            <div class="phone-card">
              <div class="phone-period">Тиждень</div>
              <div class="phone-row">
                <span>Дзвінків</span>
                <b>${callsWeek}</b>
              </div>
              <div class="phone-row">
                <span>Час розмов</span>
                <b>${formatCallTime(totalWeekSec)}</b>
              </div>
              <div class="phone-row">
                <span>Середня тривалість</span>
                <b>${formatCallTime(avgWeekSec)}</b>
              </div>
            </div>

            <div class="phone-card">
              <div class="phone-period">Місяць</div>
              <div class="phone-row">
                <span>Дзвінків</span>
                <b>${callsMonth}</b>
              </div>
              <div class="phone-row">
                <span>Час розмов</span>
                <b>${formatCallTime(totalMonthSec)}</b>
              </div>
              <div class="phone-row">
                <span>Середня тривалість</span>
                <b>${formatCallTime(avgMonthSec)}</b>
              </div>
            </div>
          </div>
        `;

      } catch (err) {
        console.error(err);
        errorBox.style.display = 'block';
        errorBox.textContent = 'Сталася помилка при завантаженні даних: ' + err.message;
      }
    }

    document.addEventListener('DOMContentLoaded', loadManagerPage);
  </script>
</body>
</html>
